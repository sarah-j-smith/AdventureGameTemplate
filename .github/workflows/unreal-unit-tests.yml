name: Unreal Engine Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
      
jobs:
  build:
    # Containers require a Linux-based runner host
    runs-on: ubuntu-latest
      
    container:
      # Requires membership of the Epic Games Github organisation and acceptance of the Terms
      # https://github.com/orgs/epicgames/packages/container/unreal-engine/492471794?tag=dev-5.6.1
      image: ghcr.io/epicgames/unreal-engine:dev-5.6.1
      credentials:
        username: ${{ secrets.GHCR_IO_USERNAME }}
        password: ${{ secrets.GITHUB_TOKEN }}

      volumes:
        - /project

    steps:
      - name: AdventureGameTemplate checkout code
        uses: actions/checkout@v4.4.0
        with:
          path: /project
          lfs: true

      - name: PaperZD checkout code
        uses: actions/checkout@v4.4.0
        with:
          repository: https://github.com/heavybullets/PaperZD
          path: /project/Plugins
          ref: v2.2.4

      - name: Build project
        working-directory: /project
        run: |
          sed -i 's/"EngineVersion":.*/"EngineVersion": "5.6.0",/g' Plugins/PaperZD/PaperZD.uplugin
          ./Scripts/Build.sh

      - name: Tests
        working-directory: /project
        run: |
          ./Scripts/Test.sh
          
